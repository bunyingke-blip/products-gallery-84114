<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Product Gallery - รายการสินค้า</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 30px 16px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.2em; margin-bottom: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .header p { font-size: 1em; opacity: 0.9; }
        .stats { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        .stats span { background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; font-size: 0.85em; white-space: nowrap; }
        .category-nav {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
            margin-bottom: 30px; padding: 14px; background: rgba(255,255,255,0.15);
            border-radius: 12px;
        }
        .category-nav a {
            color: white; text-decoration: none; padding: 7px 14px;
            background: rgba(255,255,255,0.2); border-radius: 16px; font-size: 0.85em;
            transition: background 0.2s; white-space: nowrap;
        }
        .category-nav a:hover, .category-nav a:active { background: rgba(255,255,255,0.4); }
        .category {
            margin-bottom: 36px; background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); scroll-margin-top: 16px;
        }
        .category-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 16px 18px; font-size: 1.4em; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
        }
        .category-header .count { font-size: 0.5em; opacity: 0.85; font-weight: normal; }
        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px; padding: 18px;
        }
        .product-card {
            background: #f8f9fa; border-radius: 8px; overflow: hidden;
            transition: all 0.2s ease; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: none;
        }
        .product-card:hover, .product-card:active { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .product-images { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #e9ecef; overflow: hidden; }
        .product-images img { width: 100%; height: 100%; object-fit: cover; display: none; pointer-events: none; }
        .product-images img.active { display: block; }
        .click-hint {
            position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.55); color: white;
            border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center;
            justify-content: center; font-size: 14px; pointer-events: none;
        }
        .image-nav {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 4px; background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 20px;
            max-width: 90%; overflow: hidden;
        }
        .image-nav span {
            width: 6px; height: 6px; background: rgba(255,255,255,0.5); border-radius: 50%;
            flex-shrink: 0;
        }
        .image-nav span.active { background: white; width: 16px; border-radius: 4px; }
        .product-info { padding: 10px 12px; }
        .product-name { font-size: 0.92em; font-weight: 600; color: #333; margin-bottom: 4px; word-break: break-word; line-height: 1.3; }
        .image-count { color: #667eea; font-size: 0.8em; font-weight: 500; }

        /* Lightbox modal */
        .lightbox-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            z-index: 1000; flex-direction: column; align-items: center; justify-content: center;
            padding: 0; touch-action: none;
        }
        .lightbox-overlay.open { display: flex; }
        .lightbox-header {
            position: absolute; top: 0; left: 0; right: 0; padding: 14px 16px;
            display: flex; justify-content: space-between; align-items: center;
            color: white; z-index: 10; background: linear-gradient(rgba(0,0,0,0.6), transparent);
        }
        .lightbox-title { font-size: 1em; font-weight: 600; max-width: 75%; }
        .lightbox-counter { font-size: 0.85em; opacity: 0.85; margin-top: 2px; }
        .lightbox-close {
            background: rgba(255,255,255,0.15); border: none; color: white; width: 38px; height: 38px;
            border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0;
        }
        .lightbox-close:active { background: rgba(255,255,255,0.3); }
        .lightbox-main {
            position: relative; width: 100%; flex: 1; display: flex; align-items: center;
            justify-content: center; overflow: hidden; min-height: 0;
        }
        .lightbox-main img {
            max-width: 94%; max-height: 100%; object-fit: contain; -webkit-user-select: none; user-select: none;
        }
        .lightbox-arrow {
            position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15);
            border: none; color: white; width: 44px; height: 44px; border-radius: 50%; font-size: 22px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5;
        }
        .lightbox-arrow:active { background: rgba(255,255,255,0.3); }
        .lightbox-arrow.prev { left: 10px; }
        .lightbox-arrow.next { right: 10px; }
        .lightbox-thumbs {
            display: flex; gap: 8px; padding: 12px 14px; overflow-x: auto; width: 100%;
            -webkit-overflow-scrolling: touch; scrollbar-width: thin;
        }
        .lightbox-thumbs img {
            width: 54px; height: 54px; object-fit: cover; border-radius: 6px; opacity: 0.55;
            border: 2px solid transparent; flex-shrink: 0; cursor: pointer;
        }
        .lightbox-thumbs img.active { opacity: 1; border-color: #6ee7d8; }
        body.modal-open { overflow: hidden; }

        @media (max-width: 640px) {
            body { padding: 16px 10px; }
            .header h1 { font-size: 1.5em; }
            .header p { font-size: 0.85em; }
            .stats span { font-size: 0.75em; padding: 5px 10px; }
            .category-nav { gap: 6px; padding: 10px; margin-bottom: 20px; }
            .category-nav a { font-size: 0.78em; padding: 6px 11px; }
            .category-header { font-size: 1.1em; padding: 12px 14px; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; }
            .product-name { font-size: 0.82em; }
            .image-count { font-size: 0.72em; }
            .lightbox-arrow { width: 38px; height: 38px; font-size: 18px; }
            .lightbox-thumbs img { width: 44px; height: 44px; }
            .lightbox-title { font-size: 0.88em; }
        }
        @media (min-width: 641px) and (max-width: 1024px) {
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        }
        .sub-nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 18px; background: #f1f3ff; border-bottom: 1px solid #e3e6f5; }
        .sub-nav a { color: #4b4fb3; text-decoration: none; background: white; border: 1px solid #c9ccef; padding: 6px 14px; border-radius: 16px; font-size: 0.85em; font-weight: 600; white-space: nowrap; }
        .sub-nav a:hover, .sub-nav a:active { background: #e3e6ff; }
        .sub-header { margin: 8px 18px 0; padding: 10px 14px; border-left: 5px solid #764ba2; background: #f6f2fb; color: #4a2d6b; font-size: 1.05em; font-weight: 700; display: flex; justify-content: space-between; align-items: center; border-radius: 0 8px 8px 0; scroll-margin-top: 12px; }
        .sub-header .count { font-size: 0.8em; font-weight: 500; opacity: 0.75; }
        @media (max-width: 640px) { .sub-nav { padding: 10px 12px; } .sub-header { margin: 6px 12px 0; font-size: 0.95em; } }
        .footer { text-align: center; color: white; margin-top: 40px; padding: 16px; opacity: 0.8; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Product Gallery</h1>
            <p>รายการสินค้าทั้งหมด - ทุกยี่ห้อ ทุกประเภท</p>
            <div class="stats" id="stats"></div>
        </div>
        <div class="category-nav" id="categoryNav"></div>
        <div id="gallery"></div>
        <div class="footer"><p>แตะที่สินค้าเพื่อดูรูปทุกสี/แบบ | Tap a product to view all colors</p></div>
    </div>

    <div class="lightbox-overlay" id="lightbox">
        <div class="lightbox-header">
            <div>
                <div class="lightbox-title" id="lbTitle"></div>
                <div class="lightbox-counter" id="lbCounter"></div>
            </div>
            <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
        </div>
        <div class="lightbox-main" id="lbMain">
            <button class="lightbox-arrow prev" id="lbPrev" aria-label="Previous">&#10094;</button>
            <img id="lbImage" src="" alt="">
            <button class="lightbox-arrow next" id="lbNext" aria-label="Next">&#10095;</button>
        </div>
        <div class="lightbox-thumbs" id="lbThumbs"></div>
    </div>

        // หมวดย่อยของแต่ละยี่ห้อ: แยกตามประเภทแขนเสื้อ (ใช้กับยี่ห้อ CPU และ Poligan)
        const SUBGROUPS = { 'CPU': ['แขนสั้น', 'แขนยาว', 'แขนกุด'], 'Poligan': ['เสื้อโปโล', 'เสื้อยืด'] };
        function SUBLABEL(cat, p) { return cat === 'CPU' ? 'เสื้อกีฬา' + p : p; }

        function slug(s) { return 'cat-' + s.replace(/[^a-zA-Z0-9ก-๙]/g, '_'); }

        let currentImages = [];
        let currentIndex = 0;
        let currentTitle = '';

        function initGallery() {
            const gallery = document.getElementById('gallery');
            const nav = document.getElementById('categoryNav');
            const stats = document.getElementById('stats');

            let totalProducts = 0, totalImages = 0;

            Object.entries(galleryData).forEach(([categoryName, products]) => {
                const pCount = Object.keys(products).length;
                totalProducts += pCount;

                const navLink = document.createElement('a');
                navLink.href = '#' + slug(categoryName);
                navLink.textContent = categoryName + ' (' + pCount + ')';
                nav.appendChild(navLink);

                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                categoryDiv.id = slug(categoryName);

                const categoryHeader = document.createElement('div');
                categoryHeader.className = 'category-header';
                categoryHeader.innerHTML = '<span>' + categoryName + '</span><span class="count">' + pCount + ' สินค้า</span>';
                categoryDiv.appendChild(categoryHeader);

                const subOrder = SUBGROUPS[categoryName];
                const groupMap = new Map();
                Object.entries(products).forEach(([pn, info]) => {
                    let prefix = null, disp = pn;
                    if (subOrder) {
                        const i = pn.indexOf(' / ');
                        if (i > 0) { prefix = pn.slice(0, i); disp = pn.slice(i + 3); }
                    }
                    if (!groupMap.has(prefix)) groupMap.set(prefix, []);
                    groupMap.get(prefix).push([pn, disp, info]);
                });
                const groupKeys = [...groupMap.keys()];
                if (subOrder) {
                    const rank = k => { const r = subOrder.indexOf(k); return r < 0 ? 99 : r; };
                    groupKeys.sort((x, y) => rank(x) - rank(y));
                }

                if (subOrder && groupKeys.length > 1) {
                    const subNav = document.createElement('div');
                    subNav.className = 'sub-nav';
                    groupKeys.forEach(prefix => {
                        const a = document.createElement('a');
                        a.href = '#' + slug(categoryName + '_' + prefix);
                        a.textContent = SUBLABEL(categoryName, prefix) + ' (' + groupMap.get(prefix).length + ')';
                        subNav.appendChild(a);
                    });
                    categoryDiv.appendChild(subNav);
                }

                groupKeys.forEach(prefix => {
                    if (prefix !== null) {
                        const subHeader = document.createElement('div');
                        subHeader.className = 'sub-header';
                        subHeader.id = slug(categoryName + '_' + prefix);
                        subHeader.innerHTML = '<span>' + SUBLABEL(categoryName, prefix) + '</span><span class="count">' + groupMap.get(prefix).length + ' รุ่น</span>';
                        categoryDiv.appendChild(subHeader);
                    }

                    const productsGrid = document.createElement('div');
                    productsGrid.className = 'products-grid';

                    groupMap.get(prefix).forEach(([productName, displayName, info]) => {
                        const lbName = prefix ? (categoryName + ' ' + prefix + ' ' + displayName) : productName;
                        const images = info.images;
                        const basePath = info.path;
                        if (!images || images.length === 0) return;
                        totalImages += images.length;

                        const fullPaths = images.map(img => basePath.split('/').map(encodeURIComponent).join('/') + '/' + encodeURIComponent(img));

                        const productCard = document.createElement('div');
                        productCard.className = 'product-card';
                        productCard.onclick = () => openLightbox(fullPaths, lbName);

                        const imagesDiv = document.createElement('div');
                        imagesDiv.className = 'product-images';

                        const imgElement = document.createElement('img');
                        imgElement.src = fullPaths[0];
                        imgElement.alt = lbName;
                        imgElement.loading = 'lazy';
                        imgElement.classList.add('active');
                        imagesDiv.appendChild(imgElement);

                        if (fullPaths.length > 1) {
                            const hint = document.createElement('div');
                            hint.className = 'click-hint';
                            hint.textContent = fullPaths.length;
                            imagesDiv.appendChild(hint);
                        }

                        productCard.appendChild(imagesDiv);

                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'product-info';
                        infoDiv.innerHTML = '<div class="product-name">' + displayName + '</div><div class="image-count">' + images.length + ' รูปภาพ</div>';
                        productCard.appendChild(infoDiv);

                        productsGrid.appendChild(productCard);
                    });
                    categoryDiv.appendChild(productsGrid);
                });
                gallery.appendChild(categoryDiv);
            });

            stats.innerHTML = '<span>' + Object.keys(galleryData).length + ' หมวดหมู่</span><span>' + totalProducts + ' สินค้า</span><span>' + totalImages + ' รูปภาพ</span>';
        }

        // ---- Lightbox ----
        const lightbox = document.getElementById('lightbox');
        const lbImage = document.getElementById('lbImage');
        const lbTitle = document.getElementById('lbTitle');
        const lbCounter = document.getElementById('lbCounter');
        const lbThumbs = document.getElementById('lbThumbs');

        function openLightbox(images, title) {
            currentImages = images;
            currentIndex = 0;
            currentTitle = title;
            renderLightbox();
            lightbox.classList.add('open');
            document.body.classList.add('modal-open');
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            document.body.classList.remove('modal-open');
        }

        function renderLightbox() {
            lbImage.src = currentImages[currentIndex];
            lbImage.alt = currentTitle;
            lbTitle.textContent = currentTitle;
            lbCounter.textContent = (currentIndex + 1) + ' / ' + currentImages.length;

            lbThumbs.innerHTML = '';
            if (currentImages.length > 1) {
                currentImages.forEach((src, i) => {
                    const t = document.createElement('img');
                    t.src = src;
                    t.className = i === currentIndex ? 'active' : '';
                    t.onclick = (e) => { e.stopPropagation(); currentIndex = i; renderLightbox(); };
                    lbThumbs.appendChild(t);
                });
                const activeThumb = lbThumbs.children[currentIndex];
                if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }

        function lbNext() { currentIndex = (currentIndex + 1) % currentImages.length; renderLightbox(); }
        function lbPrev() { currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length; renderLightbox(); }

        document.getElementById('lbClose').onclick = closeLightbox;
        document.getElementById('lbNext').onclick = lbNext;
        document.getElementById('lbPrev').onclick = lbPrev;

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox || e.target.id === 'lbMain') closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') lbNext();
            if (e.key === 'ArrowLeft') lbPrev();
        });

        // Touch swipe support
        let touchStartX = 0;
        const lbMain = document.getElementById('lbMain');
        lbMain.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        lbMain.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(dx) > 40) { dx > 0 ? lbPrev() : lbNext(); }
        }, { passive: true });

        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
